# Independent CI for the public UberBond repository.
# This is NOT a GitHub Actions account-lock bypass, a deployment pipeline,
# or permission to skip protected branch checks. No production credentials.
version: 2.1

jobs:
  deterministic:
    docker:
      - image: cimg/node:22
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install exact locked dependencies
          command: npm ci
      - run:
          name: Run existing deterministic and safety gates
          command: npm run check

  browser:
    docker:
      - image: cimg/node:22-browsers
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install dependencies without implicit browsers
          command: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - run:
          name: Install matching Chromium
          command: npx playwright install chromium
      - run:
          name: Execute actual browser integration
          command: npm run test:browser

  postgres:
    docker:
      - image: cimg/node:22
      - image: postgres:16
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uberbond
    resource_class: medium
    environment:
      OMNIA_V9_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/uberbond
    steps:
      - checkout
      - run:
          name: Install exact locked dependencies
          command: npm ci
      - run:
          name: Wait for real disposable PostgreSQL
          command: |
            for attempt in $(seq 1 30); do
              node --input-type=module -e "import pg from 'pg'; const c = new pg.Client({connectionString: process.env.OMNIA_V9_TEST_DATABASE_URL}); try { await c.connect(); await c.query('SELECT 1'); await c.end(); } catch { process.exit(1); }" && exit 0
              sleep 2
            done
            echo "Disposable PostgreSQL was not reachable" >&2
            exit 1
      - run:
          name: Run serial real-PostgreSQL integration tests
          command: npm run test:postgres-real

workflows:
  independent-source-verification:
    jobs:
      - deterministic
      - browser
      - postgres
