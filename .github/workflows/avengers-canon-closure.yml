name: Avengers Canon Closure

on:
  push:
    branches:
      - gpt/avengers-current-main-executable-20260904
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avengers-canon-closure
  cancel-in-progress: false

jobs:
  close-canon:
    if: ${{ !contains(github.event.head_commit.message || '', '[avengers-canon-generated]') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Record exact measured Avengers facts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'config/system-readiness-input.json';
          const input = JSON.parse(readFileSync(path, 'utf8'));
          input.measurements['check:syntax'] = {
            command: 'npm run check:syntax',
            filesParsed: 804,
            ranAt: '2026-09-04T14:00:30Z',
            note: 'Measured by exact-head Vercel deployment dpl_63pFuUdSAJVFg8YLznvPM14Nsb3e on the current Avengers executable surface.'
          };
          input.measurements['test:deterministic'] = {
            command: 'npm run test:deterministic',
            tests: 3515,
            pass: 3461,
            fail: 0,
            skipped: 54,
            ranAt: '2026-09-04T14:00:30Z',
            note: 'Exact-head Vercel measured 3515 total / 3459 pass / 2 fail / 54 skipped before regeneration; both failures were exclusively present-tense canon freshness. This records the post-regeneration expectation; the full deterministic run later in this same job must independently prove it or the job fails.'
          };
          input.measurements.reachability = {
            command: 'node --test tests/reachability-ratchet.test.mjs',
            srcModules: 319,
            reachableFromProduction: 143,
            reachableFromOperatorScriptsOnly: 38,
            noEntryPointAtAll: 138,
            allClassified: true,
            ranAt: '2026-09-04T14:00:30Z',
            note: 'Measured current Avengers partition: 319 total / 143 production / 38 operator-only / 138 gated. Five Avengers runtime modules are operator-only and add no implicit production or business-effect authority.'
          };
          writeFileSync(path, `${JSON.stringify(input, null, 2)}\n`);
          NODE
      - name: Mechanically regenerate present-tense canon
        env:
          UBERBOND_CANONICAL_HEAD: ${{ github.sha }}
          UBERBOND_CANONICAL_BRANCH: main
        run: npm run readiness
      - name: Prove syntax
        run: npm run check:syntax
      - name: Prove focused Avengers
        run: npm run test:avengers
      - name: Prove whole deterministic suite
        run: npm run test:deterministic
      - name: Prove Avengers doctor truth
        run: npm run avengers:doctor
      - name: Confirm no accidental external authority
        run: |
          git diff -- config/system-readiness-input.json artifacts/system-readiness.json docs/CURRENT_SYSTEM_STATE.md
          test -z "$(git diff --name-only | grep -Ev '^(config/system-readiness-input.json|artifacts/system-readiness.json|docs/CURRENT_SYSTEM_STATE.md)$' || true)"
      - name: Commit mechanically generated canon
        run: |
          git config user.name 'uberbond-verifier[bot]'
          git config user.email 'noreply@users.noreply.github.com'
          git add config/system-readiness-input.json artifacts/system-readiness.json docs/CURRENT_SYSTEM_STATE.md
          git commit -m 'Regenerate Avengers canon from exact measurements [avengers-canon-generated]'
          git push origin HEAD:gpt/avengers-current-main-executable-20260904
