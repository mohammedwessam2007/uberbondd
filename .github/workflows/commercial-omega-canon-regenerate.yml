name: Commercial Omega exact-source canon regeneration

# One-time branch-scoped regeneration on creation of this workflow. Never
# merges, deploys, publishes, contacts buyers, or touches production secrets.
on:
  push:
    branches:
      - feat/commercialization-omega-w1-w8-20261022
    paths:
      - .github/workflows/commercial-omega-canon-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'mohammedwessam2007/uberbondd'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked repository dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Use native canon generators only
        run: |
          npm run readiness
          npm run constitution:doctor
      - name: Test source truth and hanging-response deadline
        run: node --test tests/canon-freshness.test.mjs tests/constitution-artifact-freshness.test.mjs tests/commercialization-runtime-report.test.mjs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Commit generated artifacts only, on the current verified branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/CURRENT_SYSTEM_STATE.md artifacts/system-readiness.json artifacts/constitution/directives.json
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git diff --cached --check
          git fetch --no-tags origin feat/commercialization-omega-w1-w8-20261022
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/commercialization-omega-w1-w8-20261022)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(commercial): refresh current truth with canonical generators"
          git push origin HEAD:refs/heads/feat/commercialization-omega-w1-w8-20261022
