name: Exact c708 Focused + Terminal Windows x64

on:
  push:
    branches:
      - verify/c708-night10-ubuntu2204

permissions:
  contents: read

concurrency:
  group: exact-c708-night10-windows-x64
  cancel-in-progress: false

jobs:
  terminal:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout immutable target source
        uses: actions/checkout@v4
        with:
          ref: c70815ac93eeb662ff8f5b2c3bebace81fd4b5f8
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Hydrate Windows embedded Postgres fixture when present
        shell: pwsh
        run: |
          if (Test-Path 'node_modules/@embedded-postgres/win32-x64') { npm rebuild @embedded-postgres/win32-x64 }

      - name: Prove exact target SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne 'c70815ac93eeb662ff8f5b2c3bebace81fd4b5f8') { exit 1 }
          git status --short

      - name: Run focused repaired proposal suite
        run: node --test tests/self-maintainer-proposal-model-wrapper.test.mjs

      - name: Run unchanged NIGHT-10 terminal gate
        run: node scripts/vercel-command-center-build.mjs
