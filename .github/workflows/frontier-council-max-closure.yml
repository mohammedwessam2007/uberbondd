name: Frontier Council MAX Closure

on:
  push:
    branches:
      - gpt/frontier-cognitive-fabric-20260904
    paths:
      - '.github/workflows/frontier-council-max-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-council-max-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/frontier-cognitive-fabric-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Remove stale Context Spine reachability classification
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'config/reachability-classification.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!data?.modules?.['src/frontier-context-spine.mjs']) {
            console.log('Context Spine classification already absent.');
          } else {
            delete data.modules['src/frontier-context-spine.mjs'];
            fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
            console.log('Removed only stale src/frontier-context-spine.mjs classification.');
          }
          NODE
      - name: Regenerate canonical readiness
        run: npm run readiness
      - name: Focused Frontier and Avengers gates
        run: |
          node --test tests/frontier-*.test.mjs tests/avengers-frontier-execution-guard.test.mjs tests/avengers*.test.mjs tests/agent-model*.test.mjs tests/orchestration*.test.mjs
      - name: Syntax
        run: npm run check:syntax
      - name: Full deterministic suite
        run: npm run test:deterministic
      - name: Mutation War
        run: npm run test:mutation-war
      - name: Audit
        run: npm audit --omit=dev
      - name: Commit canonical closure if and only if all gates passed
        run: |
          git config user.name 'UberBond Closure Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add config/reachability-classification.json docs artifacts package-lock.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No canonical generated changes to commit.'
          else
            git commit -m 'Regenerate canon for Frontier Council MAX closure [skip ci]'
            git push origin HEAD:gpt/frontier-cognitive-fabric-20260904
          fi
