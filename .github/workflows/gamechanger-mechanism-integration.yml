name: UberBond Gamechanger Mechanism Integration

on:
  pull_request:
    paths:
      - 'data/gamechanger-mesh/manual-integration-seeds.json'
      - 'src/gamechanger-integration-bridge.mjs'
      - 'src/gamechanger-mechanism-*.mjs'
      - 'scripts/gamechanger-integration-bridge.mjs'
      - 'scripts/gamechanger-mechanism-*.mjs'
      - 'tests/gamechanger-integration-bridge.test.mjs'
      - 'tests/gamechanger-mechanism-*.test.mjs'
      - '.github/workflows/gamechanger-mechanism-integration.yml'
  workflow_run:
    workflows: ["UberBond Gamechanger Mesh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gamechanger-mechanism-integration
  cancel-in-progress: false

jobs:
  integrate-all-mechanisms:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Restore durable integration memory
        uses: actions/cache@v4
        with:
          path: .cache/gamechanger-integration-state.json
          key: gamechanger-integration-${{ github.run_id }}
          restore-keys: |
            gamechanger-integration-
      - name: Download the completed Gamechanger Mesh evidence artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: gamechanger-mesh-${{ github.event.workflow_run.id }}
          path: upstream-gamechanger
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Select upstream mesh and whole-brain receipts
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f upstream-gamechanger/artifacts/gamechanger-mesh-latest.json ]; then
            cp upstream-gamechanger/artifacts/gamechanger-mesh-latest.json artifacts/gamechanger-mesh-latest.json
          elif [ ! -f artifacts/gamechanger-mesh-latest.json ]; then
            echo 'No Gamechanger Mesh receipt available' >&2
            exit 2
          fi
          if [ -f upstream-gamechanger/artifacts/uberbond-cognitive-cycle-latest.json ]; then
            cp upstream-gamechanger/artifacts/uberbond-cognitive-cycle-latest.json artifacts/uberbond-cognitive-cycle-latest.json
          elif [ ! -f artifacts/uberbond-cognitive-cycle-latest.json ]; then
            echo 'No whole-brain cognitive receipt available' >&2
            exit 3
          fi
      - name: Verify research bridge, all 25 primitives, organ bindings and whole-brain integration
        run: |
          node --test tests/gamechanger-integration-bridge.test.mjs
          node --test tests/gamechanger-mechanism-runtime.test.mjs tests/gamechanger-mechanism-pack.test.mjs tests/gamechanger-mechanism-cognitive.test.mjs
      - name: Compile durable governed research integration queue
        run: node scripts/gamechanger-integration-bridge.mjs
      - name: Compile all mechanisms into existing UberBond organs
        run: node scripts/gamechanger-mechanism-pack.mjs
      - name: Merge all mechanism events and bindings into the same whole-brain receipt
        run: node scripts/gamechanger-mechanism-cognitive.mjs
      - name: Assert no idea silently disappeared or gained external authority
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('artifacts/gamechanger-mechanism-pack-latest.json','utf8'));
          const c=JSON.parse(fs.readFileSync('artifacts/uberbond-cognitive-cycle-latest.json','utf8'));
          if(!r.ok || r.status!=='ALL_GAMECHANGER_MECHANISMS_INTEGRATED') process.exit(2);
          if(r.pack.mechanismCount!==25 || r.pack.runtimePrimitiveCount!==25 || r.pack.internallyIntegratedCount!==25) process.exit(3);
          if(!r.pack.allIdeasOperationalized || !r.pack.allIdeasBoundToExistingOrgans) process.exit(4);
          if(r.pack.promotionAuthority!=='NONE' || r.pack.executableExternalAuthority!=='NONE' || r.pack.commercialTruthAuthority!=='NONE') process.exit(5);
          for(const mechanism of r.pack.mechanisms){
            if(!mechanism.primitive?.implemented || mechanism.integrationState!=='INTERNAL_CONTROL_PLANE_INTEGRATED') process.exit(6);
            if(mechanism.promotionAuthority!=='NONE' || mechanism.executableExternalAuthority!=='NONE') process.exit(7);
          }
          if(c?.gamechangerMechanisms?.mechanismCount!==25 || c?.gamechangerMechanisms?.runtimePrimitiveCount!==25 || c?.gamechangerMechanisms?.internallyIntegratedCount!==25) process.exit(8);
          if(c?.gamechangerMechanisms?.promotionAuthority!=='NONE' || c?.gamechangerMechanisms?.executableExternalAuthority!=='NONE' || c?.gamechangerMechanisms?.commercialTruthAuthority!=='NONE') process.exit(9);
          console.log(JSON.stringify({mechanisms:r.pack.mechanismCount,primitives:r.pack.runtimePrimitiveCount,targetOrgans:r.pack.targetOrganCount,cognitiveEvents:c.gamechangerMechanisms.addedEvents,cognitiveRoutes:c.gamechangerMechanisms.addedRoutes,cognitiveActivations:c.gamechangerMechanisms.addedActivations,engineeringEligible:r.pack.engineeringEligibleCount,authority:'NONE'}));
          NODE
      - name: Save latest mechanism pack for subsequent UberBond consumers
        uses: actions/cache/save@v4
        with:
          path: artifacts/gamechanger-mechanism-pack-latest.json
          key: gamechanger-mechanism-pack-${{ github.run_id }}
      - name: Upload integration and augmented whole-brain receipts
        uses: actions/upload-artifact@v4
        with:
          name: gamechanger-mechanism-integration-${{ github.run_id }}
          path: |
            artifacts/gamechanger-integration-queue-latest.json
            artifacts/gamechanger-mechanism-pack-latest.json
            artifacts/uberbond-cognitive-cycle-latest.json
            .cache/gamechanger-integration-state.json
          retention-days: 30
          if-no-files-found: error
