name: UberBond Gamechanger Mesh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamechanger-mesh-hourly
  cancel-in-progress: false

jobs:
  gamechanger-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Restore and persist mesh memory
        uses: actions/cache@v4
        with:
          path: .cache/gamechanger-mesh-state.json
          key: gamechanger-mesh-state-${{ github.run_id }}
          restore-keys: |
            gamechanger-mesh-state-
      - name: Verify mesh and all 275 GENESIS source/test contracts
        run: |
          npm run test:gamechanger
          npm run test:genesis
          npm run genesis:doctor
          npm run genesis:evolution:doctor
      - name: Read and search public frontier sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run gamechanger:tick
      - name: Compile frontier shockwaves, resurrection review, unknown-unknowns and latency
        run: npm run genesis:tick
      - name: Evolve hypotheses, challenge assumptions, reopen impossible tasks and refresh implementation truth
        run: npm run genesis:evolve
      - name: Compile causal theories, counterfactual worlds and falsifiable scientist protocols
        run: npm run genesis:scientist
      - name: Evolve candidate vocabulary and ontology from unresolved frontier material
        run: npm run genesis:ontology
      - name: Upload evidence receipt and state
        uses: actions/upload-artifact@v4
        with:
          name: gamechanger-mesh-${{ github.run_id }}
          path: |
            artifacts/gamechanger-mesh-latest.json
            artifacts/perpetual-frontier-genesis-latest.json
            artifacts/genesis-evolution-latest.json
            artifacts/genesis-scientist-latest.json
            artifacts/genesis-ontology-latest.json
            artifacts/perpetual-frontier-implementation-ledger.json
            .cache/gamechanger-mesh-state.json
          retention-days: 14
          if-no-files-found: error
