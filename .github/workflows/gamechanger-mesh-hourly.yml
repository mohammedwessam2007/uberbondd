name: UberBond Gamechanger Mesh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamechanger-mesh-hourly
  cancel-in-progress: false

jobs:
  gamechanger-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Restore and persist mesh memory
        uses: actions/cache@v4
        with:
          path: .cache/gamechanger-mesh-state.json
          key: gamechanger-mesh-state-${{ github.run_id }}
          restore-keys: |
            gamechanger-mesh-state-
      - name: Restore latest self-maintenance outcome
        uses: actions/cache/restore@v4
        with:
          path: artifacts/cognitive/self-maintainer-latest.json
          key: uberbond-self-maintenance-${{ github.run_id }}
          restore-keys: |
            uberbond-self-maintenance-
      - name: Verify mesh, opportunity allocation, GENESIS and whole-brain contracts
        run: |
          npm run test:gamechanger
          node --test tests/orchestration-frontier.test.mjs tests/orchestration-frontier-tick.test.mjs tests/orchestration-gamechanger-source.test.mjs tests/external-capability-control-plane.test.mjs
          npm run test:genesis
          node --test tests/perpetual-frontier-genesis-tick.test.mjs
          node --test tests/uberbond-cognitive-graph.test.mjs tests/uberbond-cognitive-bus.test.mjs tests/uberbond-cognitive-adapters.test.mjs tests/genesis-cognitive-adapters.test.mjs tests/event-horizon-cognitive-adapter.test.mjs tests/wallbreaker-cognitive-reflex.test.mjs tests/uberbond-feature-genome.test.mjs tests/uberbond-feature-atom-atlas.test.mjs tests/frontier-model-team.test.mjs tests/whole-brain-cognitive-adapters.test.mjs tests/uberbond-metacognitive-synthesis.test.mjs tests/uberbond-genesis-reactivation.test.mjs
          npm run capabilities:doctor
          npm run genesis:doctor
      - name: Compile repository-complete Feature Genome
        run: node scripts/uberbond-feature-genome.mjs
      - name: Compile addressable Feature Atom Atlas
        run: node scripts/uberbond-feature-atom-atlas.mjs
      - name: Snapshot frontier model candidate team truth
        run: |
          mkdir -p artifacts/cognitive
          node scripts/frontier-model-team-doctor.mjs > artifacts/cognitive/frontier-model-team-doctor-latest.json
      - name: Snapshot Capability Genome truth for cognitive routing
        id: capability-doctor
        shell: bash
        run: |
          mkdir -p artifacts/cognitive
          set +e
          node scripts/capability-genome-doctor.mjs > artifacts/cognitive/capability-genome-doctor-latest.json
          doctor_status=$?
          set -e
          node -e "const fs=require('node:fs'); const p='artifacts/cognitive/capability-genome-doctor-latest.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); if(!v || typeof v.status!=='string') process.exit(2)"
          echo "doctor_status=$doctor_status" >> "$GITHUB_OUTPUT"
      - name: Snapshot Event Horizon allocation truth for cognitive routing
        id: event-horizon-doctor
        shell: bash
        run: |
          mkdir -p artifacts/cognitive
          set +e
          node scripts/event-horizon-doctor.mjs > artifacts/cognitive/event-horizon-doctor-latest.json
          doctor_status=$?
          set -e
          node -e "const fs=require('node:fs'); const p='artifacts/cognitive/event-horizon-doctor-latest.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); if(!v || typeof v.health!=='string') process.exit(2)"
          echo "doctor_status=$doctor_status" >> "$GITHUB_OUTPUT"
      - name: Read and search public frontier sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run gamechanger:tick
      - name: Compile Fable N+1 orchestration candidates
        run: node scripts/orchestration-frontier-tick.mjs
      - name: Run complete GENESIS cognitive cascade
        run: |
          npm run genesis:tick
          npm run genesis:evolve
          npm run genesis:scientist
          npm run genesis:ontology
          npm run genesis:metabolize
      - name: Synthesize unknown-unknowns, mechanism ideas and missing-law research
        run: node scripts/uberbond-metacognitive-synthesis.mjs
      - name: Reactivate relevant GENESIS ideas from associative memory
        run: node scripts/uberbond-genesis-reactivation.mjs
      - name: Route all available evidence across the UberBond cognitive graph
        shell: bash
        run: |
          args=(
            --capability-genome artifacts/cognitive/capability-genome-doctor-latest.json
            --event-horizon artifacts/cognitive/event-horizon-doctor-latest.json
            --feature-genome artifacts/uberbond-feature-genome-latest.json
            --frontier-model-team artifacts/cognitive/frontier-model-team-doctor-latest.json
            --metacognitive-synthesis artifacts/uberbond-metacognitive-synthesis-latest.json
            --genesis-reactivation artifacts/uberbond-genesis-reactivation-latest.json
          )
          if [ -s artifacts/cognitive/self-maintainer-latest.json ]; then
            args+=(--self-maintenance artifacts/cognitive/self-maintainer-latest.json)
          fi
          node scripts/uberbond-cognitive-cycle.mjs "${args[@]}"
      - name: Save latest whole-brain cognitive memory
        uses: actions/cache/save@v4
        with:
          path: artifacts/uberbond-cognitive-cycle-latest.json
          key: uberbond-cognitive-cycle-${{ github.run_id }}
      - name: Upload evidence receipt and state
        uses: actions/upload-artifact@v4
        with:
          name: gamechanger-mesh-${{ github.run_id }}
          path: |
            artifacts/gamechanger-mesh-latest.json
            artifacts/orchestration-frontier-candidates-latest.json
            artifacts/perpetual-frontier-genesis-latest.json
            artifacts/genesis-evolution-latest.json
            artifacts/genesis-scientist-latest.json
            artifacts/genesis-ontology-latest.json
            artifacts/genesis-metabolism-latest.json
            artifacts/uberbond-feature-genome-latest.json
            artifacts/uberbond-feature-atom-atlas-latest.json
            artifacts/uberbond-metacognitive-synthesis-latest.json
            artifacts/uberbond-genesis-reactivation-latest.json
            artifacts/cognitive/frontier-model-team-doctor-latest.json
            artifacts/cognitive/capability-genome-doctor-latest.json
            artifacts/cognitive/event-horizon-doctor-latest.json
            artifacts/cognitive/self-maintainer-latest.json
            artifacts/uberbond-cognitive-cycle-latest.json
            .cache/gamechanger-mesh-state.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve unhealthy cognitive organs as visible workflow failures after routing their evidence
        if: steps.capability-doctor.outputs.doctor_status != '0' || steps.event-horizon-doctor.outputs.doctor_status != '0'
        run: exit 1
