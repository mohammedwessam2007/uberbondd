name: UberBond Gamechanger Mesh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamechanger-mesh-hourly
  cancel-in-progress: false

jobs:
  gamechanger-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Restore and persist mesh memory
        uses: actions/cache@v4
        with:
          path: .cache/gamechanger-mesh-state.json
          key: gamechanger-mesh-state-${{ github.run_id }}
          restore-keys: |
            gamechanger-mesh-state-
      - name: Restore latest self-maintenance outcome
        uses: actions/cache/restore@v4
        with:
          path: artifacts/cognitive/self-maintainer-latest.json
          key: uberbond-self-maintenance-${{ github.run_id }}
          restore-keys: |
            uberbond-self-maintenance-
      - name: Verify mesh, orchestration frontier, GENESIS and cognitive graph contracts
        run: |
          npm run test:gamechanger
          node --test tests/orchestration-frontier.test.mjs tests/orchestration-frontier-tick.test.mjs tests/orchestration-gamechanger-source.test.mjs tests/external-capability-control-plane.test.mjs
          npm run test:genesis
          node --test tests/perpetual-frontier-genesis-tick.test.mjs
          node --test tests/uberbond-cognitive-graph.test.mjs tests/uberbond-cognitive-bus.test.mjs tests/uberbond-cognitive-adapters.test.mjs
          npm run capabilities:doctor
          npm run genesis:doctor
      - name: Snapshot Capability Genome truth for cognitive routing
        id: capability-doctor
        shell: bash
        run: |
          mkdir -p artifacts/cognitive
          set +e
          node scripts/capability-genome-doctor.mjs > artifacts/cognitive/capability-genome-doctor-latest.json
          doctor_status=$?
          set -e
          node -e "const fs=require('node:fs'); const p='artifacts/cognitive/capability-genome-doctor-latest.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); if(!v || typeof v.status!=='string') process.exit(2)"
          echo "doctor_status=$doctor_status" >> "$GITHUB_OUTPUT"
      - name: Read and search public frontier sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run gamechanger:tick
      - name: Compile Fable N+1 orchestration candidates
        run: node scripts/orchestration-frontier-tick.mjs
      - name: Compile frontier shockwaves, resurrection review, unknown-unknowns and latency
        run: npm run genesis:tick
      - name: Route all available evidence across the UberBond cognitive graph
        shell: bash
        run: |
          args=(
            --capability-genome artifacts/cognitive/capability-genome-doctor-latest.json
          )
          if [ -s artifacts/cognitive/self-maintainer-latest.json ]; then
            args+=(--self-maintenance artifacts/cognitive/self-maintainer-latest.json)
          fi
          node scripts/uberbond-cognitive-cycle.mjs "${args[@]}"
      - name: Save latest whole-brain cognitive memory
        uses: actions/cache/save@v4
        with:
          path: artifacts/uberbond-cognitive-cycle-latest.json
          key: uberbond-cognitive-cycle-${{ github.run_id }}
      - name: Upload evidence receipt and state
        uses: actions/upload-artifact@v4
        with:
          name: gamechanger-mesh-${{ github.run_id }}
          path: |
            artifacts/gamechanger-mesh-latest.json
            artifacts/orchestration-frontier-candidates-latest.json
            artifacts/perpetual-frontier-genesis-latest.json
            artifacts/cognitive/capability-genome-doctor-latest.json
            artifacts/cognitive/self-maintainer-latest.json
            artifacts/uberbond-cognitive-cycle-latest.json
            .cache/gamechanger-mesh-state.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve unhealthy Capability Genome as a visible workflow failure after routing its evidence
        if: steps.capability-doctor.outputs.doctor_status != '0'
        run: exit 1
