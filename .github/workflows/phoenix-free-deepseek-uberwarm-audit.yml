name: PHOENIX free DeepSeek one-module implementation (no secrets)
on:
  push:
    branches: [high/deepseek-uberwarm-no-secret-audit-20261016]
    paths: [.github/workflows/phoenix-free-deepseek-uberwarm-audit.yml]
permissions:
  contents: read
jobs:
  model-one-file-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NODE_ENV: test
      UBERBOND_EFFECTS_DISABLED: '1'
      OUTBOUND_ENABLED: 'false'
      OUTBOUND_DRY_RUN: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install exact free model client
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .env.local
          npm install -g @opencode/cli
          opencode --version
      - name: Author one narrowly scoped donor, no provider effects
        shell: bash
        run: |
          set -euo pipefail
          touch src/uberwarm2-trusted-health-supplier.mjs
          node <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('opencode.jsonc','utf8'));
          c.permissions.push({action:'edit',resource:'src/uberwarm2-trusted-health-supplier.mjs',effect:'allow'});
          fs.writeFileSync('opencode.jsonc',JSON.stringify(c,null,2)+'\n');
          NODE
          timeout 150s opencode run --standalone --auto --model opencode/deepseek-v4.1-flash-free \
            "Read src/uberwarm2-smtp-seed-bridge.mjs and src/uberwinnr-adapter.mjs. Write ONLY a NEW src/uberwarm2-trusted-health-supplier.mjs (max 125 lines) exporting a factory createUberWarm2TrustedHealthSupplier({ readProviderMailbox, readProviderDomainDns, readVerifiedSmtp, readLocalHold, readVerifiedDnsAlignment, clock }). It must return an async readSenderHealth({email,at}) array exactly one canonical observation row for use in createUberWarm2LivePreflight. Keep all inputs injected as trusted protected read callbacks, each called fresh; don't import WinNr keys or connect to any API; never infer SMTP AUTH from provider Active nor DKIM alignment from DNS record presence; require signed/evidence-backed fresh transport+DNS, explicit no-hold local record and exact matching sender/domain, fail closed to [] on any ambiguity, stale values or errors. No live provider effects, no shell, no other file edits, no billing, no messages. Keep code concise and syntax-valid. Do not produce narration instead of code. No need to author tests in this run." \
            2>&1 | tee "$RUNNER_TEMP/deepseek-onefile.txt"
          test -s src/uberwarm2-trusted-health-supplier.mjs
          node --check src/uberwarm2-trusted-health-supplier.mjs
          echo "::group::Unverified one-file donor (do not merge yet)"
          sed -n '1,160p' src/uberwarm2-trusted-health-supplier.mjs
          echo "::endgroup::"
