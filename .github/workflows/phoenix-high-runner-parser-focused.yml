name: PHOENIX High runner plus Astra parser narrow integration
on:
  push:
    branches:
      - high/phoenix-runner-parser-integrated-20261015
  pull_request:
    branches:
      - high/phoenix-n26-protected-runner-package-20261015
permissions:
  contents: read
jobs:
  parser-and-held-package-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      NODE_ENV: test
      UBERBOND_EFFECTS_DISABLED: '1'
      AUTOPILOT_ENABLED: 'false'
      OUTBOUND_ENABLED: 'false'
      OUTBOUND_DRY_RUN: 'true'
      OUTBOUND_EMERGENCY_STOP: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Exact corrected parser blob, no changed OCI runner implementation
        run: |
          test "$(git hash-object tests/infinite-opus-haiku55-live-canary.test.mjs)" = "ba64cbb449dddadbfbe5f646101ea6c011c135a1"
          test "$(git hash-object ops/phoenix-held-runner-20261015/supervise.mjs)" = "ecc5b20152a51c7b6f7d6fa24480d9405f71e064"
          test "$(git hash-object ops/phoenix-held-runner-20261015/entrypoint.sh)" = "c95e673769288050bbfefe66043218c2b8be202f"
          node --check tests/infinite-opus-haiku55-live-canary.test.mjs
          node --check ops/phoenix-held-runner-20261015/supervise.mjs
          bash -n ops/phoenix-held-runner-20261015/entrypoint.sh
      - name: Mock-only Haiku fixture unit tests, no live provider canary
        run: node --test --test-concurrency=1 tests/infinite-opus-haiku55-live-canary.test.mjs
