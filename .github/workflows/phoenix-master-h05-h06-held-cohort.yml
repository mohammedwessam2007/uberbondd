name: PHOENIX H05 H06 held public cohort
on:
  push:
    branches:
      - high/phoenix-master-h05-h06-public-held-cohort-20261015
permissions:
  contents: read
jobs:
  no-network-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/phoenix-h05-h06-public-vendor-held-cohort.test.mjs tests/uberbond-native-lead-ops.test.mjs tests/proof-factory.test.mjs
