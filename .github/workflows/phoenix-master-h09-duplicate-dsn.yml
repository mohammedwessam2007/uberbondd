name: PHOENIX H09 duplicate DSN machine evidence negative tests
on:
  push:
    branches:
      - high/phoenix-master-h09-duplicate-dsn-evidence-20261015
permissions:
  contents: read
env:
  CI: 'true'
  UBERBOND_EFFECTS_DISABLED: '1'
  OUTBOUND_ENABLED: 'false'
  OUTBOUND_DRY_RUN: 'true'
jobs:
  pure-and-held-inbound:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Parser syntax
        run: node --check src/uberimap.mjs && node --check tests/inbound-review-hostile.test.mjs
      - name: Synthetic hostile DSN and Reply Radar, no provider
        run: node --test tests/inbound-review-hostile.test.mjs tests/winnr-reply-radar.test.mjs
