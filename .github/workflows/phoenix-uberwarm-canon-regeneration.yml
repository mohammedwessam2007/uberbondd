name: PHOENIX UberWarm canon regeneration, no-effects
on:
  push:
    branches: [high/uberwarm-trusted-health-donor-20261016]
    paths: [.github/workflows/phoenix-uberwarm-canon-regeneration.yml]
permissions:
  contents: read
jobs:
  official-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NODE_ENV: test
      UBERBOND_EFFECTS_DISABLED: '1'
      OUTBOUND_ENABLED: 'false'
      OUTBOUND_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts
      - name: Regenerate via official repository script and prove freshness
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          npm run readiness
          node --test tests/canon-freshness.test.mjs tests/reachability-ratchet.test.mjs
          git diff --check
          node <<'NODE'
          const fs=require('fs');
          for (const [name,path] of [
            ['READINESS','artifacts/system-readiness.json'],
            ['CURRENT_STATE','docs/CURRENT_SYSTEM_STATE.md']
          ]) {
            console.log('BEGIN_GENERATED_'+name);
            const b64=fs.readFileSync(path).toString('base64');
            for(let i=0;i<b64.length;i+=120) console.log(b64.slice(i,i+120));
            console.log('END_GENERATED_'+name);
          }
          NODE
