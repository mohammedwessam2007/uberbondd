name: PHOENIX UberWarm trusted health donor, effects disabled
on:
  push:
    branches: [high/uberwarm-trusted-health-donor-20261016]
    paths:
      - src/uberwarm2-trusted-health-supplier.mjs
      - tests/uberwarm2-trusted-health-supplier.test.mjs
      - .github/workflows/phoenix-uberwarm-health-donor-ci.yml
permissions:
  contents: read
jobs:
  verified-health-donor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      UBERBOND_EFFECTS_DISABLED: '1'
      OUTBOUND_ENABLED: 'false'
      OUTBOUND_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install repository dependencies with no scripts
        run: npm ci --ignore-scripts
      - name: Exact-source syntax and no-effect trusted health proof
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --check src/uberwarm2-trusted-health-supplier.mjs
          node --check tests/uberwarm2-trusted-health-supplier.test.mjs
          node --test --test-concurrency=1 tests/uberwarm2-trusted-health-supplier.test.mjs tests/uberwarm2-live-preflight.test.mjs tests/uberwarm2-seed-executor.test.mjs tests/uberwarm2-smtp-seed-bridge.test.mjs tests/uberwarm3-reputation-oracle.test.mjs tests/uberwarm4-receiver-protection.test.mjs tests/uberwarm5-capacity-bridge.test.mjs
          git diff --check
