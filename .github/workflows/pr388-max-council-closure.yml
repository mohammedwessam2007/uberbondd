name: PR388 MAX Council one-shot closure

on:
  push:
    branches:
      - gpt/frontier-cognitive-fabric-20260904

permissions:
  contents: write

concurrency:
  group: pr388-max-council-closure
  cancel-in-progress: false

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: gpt/frontier-cognitive-fabric-20260904
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove only stale reachable Context Spine classification
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'config/reachability-classification.json';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!doc.modules?.['src/frontier-context-spine.mjs']) {
            throw new Error('expected stale frontier-context-spine classification is absent; refusing ambiguous closure');
          }
          delete doc.modules['src/frontier-context-spine.mjs'];
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE

      - name: Canonical readiness regeneration
        run: npm run readiness

      - name: Focused MAX Council and Frontier war
        shell: bash
        run: |
          node --test \
            tests/frontier-cognitive-fabric.test.mjs \
            tests/frontier-cognitive-admission.test.mjs \
            tests/frontier-callability-provenance.test.mjs \
            tests/frontier-reasoning-runtime.test.mjs \
            tests/frontier-reasoning-runtime-boundary.test.mjs \
            tests/frontier-cognitive-runtime-e2e.test.mjs \
            tests/frontier-council-runtime.test.mjs \
            tests/avengers-execution-guard.test.mjs

      - name: Syntax
        run: npm run check:syntax

      - name: Full deterministic suite
        run: npm run test:deterministic

      - name: Avengers suite
        run: npm run test:avengers

      - name: Context Spine and orchestration gates
        shell: bash
        run: |
          node --test tests/frontier-parity-autonomy.test.mjs tests/orchestration-frontier.test.mjs tests/orchestration-frontier-tick.test.mjs

      - name: Mutation War
        run: npm run test:mutation-war

      - name: Reachability and canon freshness
        run: node --test tests/reachability-ratchet.test.mjs tests/canon-freshness.test.mjs

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Repository diff safety
        run: git diff --check

      - name: Commit canonical closure and self-delete workflow
        shell: bash
        run: |
          git rm .github/workflows/pr388-max-council-closure.yml
          git config user.name 'uberbond-verification-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/reachability-classification.json docs artifacts
          git add -u
          echo '--- staged closure diff ---'
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No closure delta produced; refusing empty success commit.' >&2
            exit 1
          fi
          git commit -m 'Close MAX Council canon and exact-head verification'
          git push origin HEAD:gpt/frontier-cognitive-fabric-20260904
