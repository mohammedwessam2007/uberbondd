name: UberBond Finite Completion Wake

on:
  workflow_dispatch:

concurrency:
  group: uberbond-finite-completion-wake
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  pulse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Honor durable founder pause fence
        id: control
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! paused=$(gh api "/repos/${GH_REPOSITORY}/issues/604" --jq '[.labels[].name] | index("uberbond-autonomy-paused") != null'); then
            echo 'Command Center pause state is unavailable; failing closed.' >&2
            echo 'paused=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "paused=${paused}" >> "$GITHUB_OUTPUT"

      - name: Collapse manual fallback when the trusted self-maintainer is already active
        id: active
        if: steps.control.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh api "/repos/${GH_REPOSITORY}/actions/workflows/uberbond-self-maintainer.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
          echo "count=$active" >> "$GITHUB_OUTPUT"
          if [ "$active" != '0' ]; then
            echo "Self-maintainer already has ${active} active/queued run(s); manual cloud fallback collapses to no-op."
          fi

      - name: Checkout exact current main for finite completion truth
        if: steps.control.outputs.paused != 'true' && steps.active.outputs.count == '0'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.control.outputs.paused != 'true' && steps.active.outputs.count == '0'
        with:
          node-version: 22

      - name: Verify protected admission of finite-completion controller
        if: steps.control.outputs.paused != 'true' && steps.active.outputs.count == '0'
        shell: bash
        run: |
          set -euo pipefail
          expected='1501ea4e2d298704424b1d8b3c8f504970188b0a'
          actual=$(git hash-object scripts/uberbond-finite-completion-seed.mjs)
          if [ "$actual" != "$expected" ]; then
            echo "Finite completion controller digest drifted: expected ${expected}, observed ${actual}. Protected/manual re-admission required." >&2
            exit 1
          fi

      - name: Regenerate exact-current terminal truth before choosing work
        id: terminal
        if: steps.control.outputs.paused != 'true' && steps.active.outputs.count == '0'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node scripts/terminal-realization.mjs
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "Terminal realization crashed unexpectedly with exit ${rc}." >&2
            exit "$rc"
          fi
          if [ "$rc" -eq 2 ]; then
            echo 'Terminal realization measured an incomplete/refused finite state; the seeder will consume that exact evidence rather than guessing.'
          fi

      - name: Seed exactly one finite-completion task from freshly regenerated tribunal truth
        id: seed
        if: steps.control.outputs.paused != 'true' && steps.active.outputs.count == '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/uberbond-finite-completion-seed.mjs

      - name: Dispatch trusted self-maintainer onto the exact seeded completion task
        if: steps.control.outputs.paused != 'true' && steps.active.outputs.count == '0' && steps.seed.outputs.closed != 'true' && steps.seed.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.seed.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${GH_REPOSITORY}/actions/workflows/uberbond-self-maintainer.yml/dispatches" \
            -f ref='main' \
            -F "inputs[issueNumber]=${ISSUE_NUMBER}"
          echo "Finite completion task #${ISSUE_NUMBER} dispatched to the trusted self-maintainer."

      - name: Report finite completion already closed
        if: steps.control.outputs.paused != 'true' && steps.active.outputs.count == '0' && steps.seed.outputs.closed == 'true'
        run: echo 'Declared finite engineering scope is already closed on this exact main; no engineering task dispatched.'

      - name: Report founder pause fence
        if: steps.control.outputs.paused == 'true'
        run: echo 'Founder pause fence is active; no new finite-completion task or self-maintainer run was created.'
