name: UberBond Self Maintainer Verify

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: uberbond-self-maintainer-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  independent-verification:
    if: >-
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      startsWith(github.head_ref, 'uberbond/self-maintain/') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UBERBOND_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      UBERBOND_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      UBERBOND_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      UBERBOND_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      UBERBOND_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      OUTBOUND_ENABLED: 'false'
      OUTBOUND_DRY_RUN: 'true'
      AUTO_EMAIL_REPORTS: 'false'
      DISCOVERY_ENABLED: 'false'
      DISCOVERY_DRY_RUN: 'true'
      ALLOW_TEST_PAYMENT_UNLOCK: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Reconstruct PR through canonical autonomous-change constitution
        run: |
          mkdir -p artifacts/cognitive
          node .github/workflows/runtime/self-maintainer-pr-verifier.mjs > artifacts/cognitive/self-maintainer-pr-verification.json
      - name: Parse every JavaScript module
        run: npm run check:syntax
      - name: Run deterministic whole-repository tribunal
        run: npm run test:deterministic
      - name: Re-run sovereignty-critical autonomous-maintenance regressions explicitly
        run: >-
          node --test
          tests/sovereignty-self-modification.test.mjs
          tests/enforcement-surface-sovereignty-boundary.test.mjs
          tests/self-maintainer-proposal-contract.test.mjs
          tests/uberbond-self-maintainer-tick.test.mjs
      - name: Upload independent verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uberbond-self-maintainer-verification-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/cognitive/self-maintainer-pr-verification.json
          retention-days: 14
          if-no-files-found: warn
