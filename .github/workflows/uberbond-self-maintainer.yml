name: UberBond Self Maintainer

on:
  push:
    branches:
      - main
  schedule:
    - cron: '7,37 * * * *'
  repository_dispatch:
    types:
      - uberbond-self-maintainer-continuation
  workflow_dispatch:
    inputs:
      issueNumber:
        description: 'Optional existing agent-relay issue number to process'
        required: false
        type: string

concurrency:
  group: uberbond-self-maintainer
  cancel-in-progress: false

jobs:
  bounded-maintenance:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      promoted: ${{ steps.coordinates.outputs.promoted }}
      pr_number: ${{ steps.coordinates.outputs.pr_number }}
      branch: ${{ steps.coordinates.outputs.branch }}
      base_sha: ${{ steps.coordinates.outputs.base_sha }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UBERBOND_SELF_MAINTAINER_ISSUE_NUMBER: ${{ inputs.issueNumber }}
      UBERBOND_COGNITIVE_CYCLE_PATH: artifacts/uberbond-cognitive-cycle-latest.json
      AI_PROVIDER: rules
      AI_GATEWAY_AGENT_ENABLED: 'false'
      OUTBOUND_ENABLED: 'false'
      OUTBOUND_DRY_RUN: 'true'
      AUTO_EMAIL_REPORTS: 'false'
      DISCOVERY_ENABLED: 'false'
      DISCOVERY_DRY_RUN: 'true'
      ALLOW_TEST_PAYMENT_UNLOCK: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore latest whole-brain cognitive memory
        uses: actions/cache/restore@v4
        with:
          path: artifacts/uberbond-cognitive-cycle-latest.json
          key: uberbond-cognitive-cycle-${{ github.run_id }}
          restore-keys: |
            uberbond-cognitive-cycle-
      - name: Restore prior self-maintainer continuation memory
        uses: actions/cache/restore@v4
        with:
          path: .cache/uberbond-self-maintainer-continuation.json
          key: uberbond-self-maintenance-continuation-${{ github.run_id }}
          restore-keys: |
            uberbond-self-maintenance-continuation-
      - name: Install exact locked dependencies
        run: npm ci
      - name: Enforce prior continuation before same-base reentry
        id: preflight
        shell: bash
        run: |
          mkdir -p artifacts/cognitive .cache
          node scripts/self-maintainer-pulse-preflight.mjs .cache/uberbond-self-maintainer-continuation.json > artifacts/cognitive/self-maintainer-preflight.json
          run_tick=$(node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('artifacts/cognitive/self-maintainer-preflight.json','utf8'));process.stdout.write(v.runPrimaryTick===true?'true':'false')")
          resume_issue_number=$(node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('artifacts/cognitive/self-maintainer-preflight.json','utf8'));const n=Number(v.resumeIssueNumber||0);process.stdout.write(Number.isSafeInteger(n)&&n>0?String(n):'')")
          resume_only=$(node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('artifacts/cognitive/self-maintainer-preflight.json','utf8'));process.stdout.write(v.resumeExistingAttemptOnly===true?'true':'false')")
          echo "run_tick=$run_tick" >> "$GITHUB_OUTPUT"
          echo "resume_issue_number=$resume_issue_number" >> "$GITHUB_OUTPUT"
          echo "resume_only=$resume_only" >> "$GITHUB_OUTPUT"
      - name: Run initial whole-brain self-maintenance tick
        id: initial
        if: steps.preflight.outputs.run_tick == 'true'
        shell: bash
        env:
          UBERBOND_SELF_MAINTAINER_ISSUE_NUMBER: ${{ steps.preflight.outputs.resume_issue_number || inputs.issueNumber }}
        run: |
          mkdir -p artifacts/cognitive
          set +e
          node scripts/uberbond-self-maintainer-tick.mjs > artifacts/cognitive/self-maintainer-initial.json
          tick_status=$?
          set -e
          node -e "const fs=require('node:fs'); const p='artifacts/cognitive/self-maintainer-initial.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); if(!v || typeof v.status!=='string') process.exit(2); process.stdout.write(String(v.issueNumber || 0))" > /tmp/uberbond-self-maintainer-issue
          node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('artifacts/cognitive/self-maintainer-initial.json','utf8')); process.stdout.write(String(v.status || 'UNKNOWN'))" > /tmp/uberbond-self-maintainer-status
          if [ "$tick_status" != '0' ] && node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('artifacts/cognitive/self-maintainer-initial.json','utf8'));process.exit(v.status==='CANDIDATE_REJECTED'&&Array.isArray(v.reasonCodes)&&v.reasonCodes.includes('worker-decision-stop')?0:1)"; then
            tick_status=0
            echo 'no_safe_change=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tick_status=$tick_status" >> "$GITHUB_OUTPUT"
          echo "issue_number=$(cat /tmp/uberbond-self-maintainer-issue)" >> "$GITHUB_OUTPUT"
          echo "primary_status=$(cat /tmp/uberbond-self-maintainer-status)" >> "$GITHUB_OUTPUT"
      - name: Verify resume-only pulse stayed on the exact existing task
        if: steps.preflight.outputs.resume_only == 'true' && steps.initial.outputs.issue_number != steps.preflight.outputs.resume_issue_number
        run: |
          echo 'resume-only pulse escaped its bound relay issue' >&2
          exit 1
      - name: Generate and submit canonical proposal only when proposal work is actually pending
        id: proposal
        if: >-
          steps.initial.outputs.issue_number != '0' &&
          (steps.initial.outputs.primary_status == 'RELAY_TASK_QUEUED' ||
           steps.initial.outputs.primary_status == 'RELAY_TASK_ALREADY_QUEUED' ||
           steps.initial.outputs.primary_status == 'WAITING_FOR_WORKER_RESULT')
        shell: bash
        env:
          UBERBOND_SELF_MAINTAINER_ISSUE_NUMBER: ${{ steps.initial.outputs.issue_number }}
        run: |
          set +e
          node .github/workflows/runtime/self-maintainer-proposal-dispatch.mjs artifacts/cognitive/self-maintainer-initial.json > artifacts/cognitive/self-maintainer-proposal-dispatch.json
          proposal_status=$?
          set -e
          node -e "const fs=require('node:fs'); const p='artifacts/cognitive/self-maintainer-proposal-dispatch.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); if(!v || typeof v.status!=='string') process.exit(2)"
          echo "proposal_status=$proposal_status" >> "$GITHUB_OUTPUT"
      - name: Run verification and review-promotion tick only after successful proposal dispatch
        id: final
        if: steps.proposal.outputs.proposal_status == '0'
        shell: bash
        env:
          UBERBOND_SELF_MAINTAINER_ISSUE_NUMBER: ${{ steps.initial.outputs.issue_number }}
        run: |
          set +e
          node scripts/uberbond-self-maintainer-tick.mjs > artifacts/cognitive/self-maintainer-latest.json
          tick_status=$?
          set -e
          node -e "const fs=require('node:fs'); const p='artifacts/cognitive/self-maintainer-latest.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); if(!v || typeof v.status!=='string') process.exit(2)"
          if [ "$tick_status" != '0' ] && node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync('artifacts/cognitive/self-maintainer-latest.json','utf8'));process.exit(v.status==='CANDIDATE_REJECTED'&&Array.isArray(v.reasonCodes)&&v.reasonCodes.includes('worker-decision-stop')?0:1)"; then
            tick_status=0
            echo 'no_safe_change=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tick_status=$tick_status" >> "$GITHUB_OUTPUT"
      - name: Preserve initial truth whenever no second tick was justified
        if: always()
        shell: bash
        run: |
          if [ ! -f artifacts/cognitive/self-maintainer-latest.json ] && [ -f artifacts/cognitive/self-maintainer-initial.json ]; then
            cp artifacts/cognitive/self-maintainer-initial.json artifacts/cognitive/self-maintainer-latest.json
          fi
      - name: Export exact promoted review coordinates
        id: coordinates
        if: always()
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const paths=['artifacts/cognitive/self-maintainer-latest.json','artifacts/cognitive/self-maintainer-initial.json'];
          let value=null;
          for(const p of paths){try{const v=JSON.parse(fs.readFileSync(p,'utf8'));if(v){value=v;break}}catch{}}
          const promotion=value?.promotion||{};
          const marker=value?.promotionMarker||{};
          const pr=Number(promotion.prNumber||marker.prNumber||0);
          const branch=String(promotion.branch||marker.branch||'');
          const base=String(promotion.baseRevision||marker.baseRevision||value?.baseRevision||'').toLowerCase();
          const promoted=Number.isSafeInteger(pr)&&pr>0&&branch.startsWith('uberbond/self-maintain/')&&/^[a-f0-9]{40}$/.test(base);
          console.log(`promoted=${promoted?'true':'false'}`);
          console.log(`pr_number=${promoted?pr:0}`);
          console.log(`branch=${promoted?branch:''}`);
          console.log(`base_sha=${promoted?base:''}`);
          NODE
      - name: Compile or preserve non-repeating continuation decision
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.preflight.outputs.run_tick }}' = 'false' ] && [ -f .cache/uberbond-self-maintainer-continuation.json ]; then
            cp .cache/uberbond-self-maintainer-continuation.json artifacts/cognitive/self-maintainer-continuation.json
          elif [ -f artifacts/cognitive/self-maintainer-latest.json ]; then
            node scripts/self-maintainer-continuation-receipt.mjs artifacts/cognitive/self-maintainer-latest.json > artifacts/cognitive/self-maintainer-continuation.json
          elif [ -f artifacts/cognitive/self-maintainer-initial.json ]; then
            node scripts/self-maintainer-continuation-receipt.mjs artifacts/cognitive/self-maintainer-initial.json > artifacts/cognitive/self-maintainer-continuation.json
          else
            printf '%s\n' '{"schemaVersion":"uberbond.self-maintainer-continuation-receipt.v1","status":"NO_PRIMARY_RECEIPT","businessEffectAuthority":"NONE"}' > artifacts/cognitive/self-maintainer-continuation.json
          fi
          cp artifacts/cognitive/self-maintainer-continuation.json .cache/uberbond-self-maintainer-continuation.json
      - name: Save self-maintenance truth for the next evidence-triggered pulse
        uses: actions/cache/save@v4
        with:
          path: artifacts/cognitive/self-maintainer-latest.json
          key: uberbond-self-maintenance-${{ github.run_id }}
      - name: Save continuation guard for the next pulse
        uses: actions/cache/save@v4
        with:
          path: .cache/uberbond-self-maintainer-continuation.json
          key: uberbond-self-maintenance-continuation-${{ github.run_id }}
      - name: Upload complete self-maintenance evidence packet
        uses: actions/upload-artifact@v4
        with:
          name: uberbond-self-maintenance-${{ github.run_id }}
          path: |
            artifacts/cognitive/self-maintainer-preflight.json
            artifacts/cognitive/self-maintainer-initial.json
            artifacts/cognitive/self-maintainer-proposal-dispatch.json
            artifacts/cognitive/self-maintainer-latest.json
            artifacts/cognitive/self-maintainer-continuation.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve unsuccessful maintenance as visible workflow failure after evidence is saved
        shell: bash
        run: |
          initial='${{ steps.initial.outputs.tick_status }}'
          proposal='${{ steps.proposal.outputs.proposal_status }}'
          final='${{ steps.final.outputs.tick_status }}'
          if [ -n "$initial" ] && [ "$initial" != '0' ]; then exit 1; fi
          if [ -n "$proposal" ] && [ "$proposal" != '0' ]; then exit 1; fi
          if [ -n "$final" ] && [ "$final" != '0' ]; then exit 1; fi

  independent-verification:
    needs: bounded-maintenance
    if: needs.bounded-maintenance.result == 'success' && needs.bounded-maintenance.outputs.promoted == 'true'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      pr_number: ${{ needs.bounded-maintenance.outputs.pr_number }}
      head_sha: ${{ steps.verified-coordinates.outputs.head_sha }}
      base_sha: ${{ steps.verified-coordinates.outputs.base_sha }}
    env:
      OUTBOUND_ENABLED: 'false'
      OUTBOUND_DRY_RUN: 'true'
      AUTO_EMAIL_REPORTS: 'false'
      DISCOVERY_ENABLED: 'false'
      DISCOVERY_DRY_RUN: 'true'
      ALLOW_TEST_PAYMENT_UNLOCK: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout exact promoted branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bounded-maintenance.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Derive exact candidate coordinates from Git ancestry
        id: verified-coordinates
        shell: bash
        run: |
          head_sha=$(git rev-parse HEAD)
          base_sha=$(git rev-parse HEAD^)
          if [ "$base_sha" != '${{ needs.bounded-maintenance.outputs.base_sha }}' ]; then
            echo 'candidate parent no longer equals promoted base' >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Install exact locked dependencies
        run: npm ci
      - name: Reconstruct candidate through canonical autonomous-change constitution
        env:
          UBERBOND_PR_BASE_SHA: ${{ steps.verified-coordinates.outputs.base_sha }}
          UBERBOND_PR_HEAD_SHA: ${{ steps.verified-coordinates.outputs.head_sha }}
          UBERBOND_PR_BASE_REF: main
          UBERBOND_PR_HEAD_REF: ${{ needs.bounded-maintenance.outputs.branch }}
          UBERBOND_PR_AUTHOR: github-actions[bot]
        run: |
          mkdir -p artifacts/cognitive
          node .github/workflows/runtime/self-maintainer-pr-verifier.mjs > artifacts/cognitive/self-maintainer-pr-verification.json
      - name: Parse every JavaScript module
        run: npm run check:syntax
      - name: Run deterministic whole-repository tribunal
        run: npm run test:deterministic
      - name: Re-run sovereignty-critical autonomous-maintenance regressions explicitly
        run: >-
          node --test
          tests/sovereignty-self-modification.test.mjs
          tests/enforcement-surface-sovereignty-boundary.test.mjs
          tests/self-maintainer-proposal-contract.test.mjs
          tests/uberbond-self-maintainer-tick.test.mjs
      - name: Upload independent verifier receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uberbond-self-maintainer-verification-${{ needs.bounded-maintenance.outputs.pr_number }}-${{ steps.verified-coordinates.outputs.head_sha }}
          path: artifacts/cognitive/self-maintainer-pr-verification.json
          retention-days: 14
          if-no-files-found: warn

  merge-verified-self-maintainer:
    needs:
      - bounded-maintenance
      - independent-verification
    if: needs.independent-verification.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UBERBOND_VERIFICATION_MODE: JOB_CHAIN
      UBERBOND_VERIFICATION_JOB_RESULT: ${{ needs.independent-verification.result }}
      UBERBOND_PR_NUMBER: ${{ needs.independent-verification.outputs.pr_number }}
      UBERBOND_VERIFY_HEAD_SHA: ${{ needs.independent-verification.outputs.head_sha }}
      UBERBOND_VERIFY_BASE_SHA: ${{ needs.independent-verification.outputs.base_sha }}
    steps:
      - name: Checkout trusted current main only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge only the exact independently verified local-preparation head
        run: |
          mkdir -p artifacts/cognitive
          node .github/workflows/runtime/self-maintainer-merge-governor.mjs > artifacts/cognitive/self-maintainer-merge-governor.json
      - name: Upload merge-governor receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uberbond-self-maintainer-merge-${{ needs.independent-verification.outputs.pr_number }}-${{ needs.independent-verification.outputs.head_sha }}
          path: artifacts/cognitive/self-maintainer-merge-governor.json
          retention-days: 30
          if-no-files-found: warn
