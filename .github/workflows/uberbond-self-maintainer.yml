name: UberBond Self Maintainer

on:
  schedule:
    # Aggressive but bounded: four pulses per hour. Task identity is still
    # exact-main-SHA derived, so repeated pulses cannot manufacture duplicate
    # maintenance missions for the same source revision.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      issueNumber:
        description: 'Optional existing agent-relay issue number to process'
        required: false
        type: string

concurrency:
  group: uberbond-self-maintainer
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  bounded-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UBERBOND_SELF_MAINTAINER_ISSUE_NUMBER: ${{ inputs.issueNumber }}
      UBERBOND_COGNITIVE_CYCLE_PATH: artifacts/uberbond-cognitive-cycle-latest.json
      AI_PROVIDER: rules
      AI_GATEWAY_AGENT_ENABLED: 'false'
      OUTBOUND_ENABLED: 'false'
      OUTBOUND_DRY_RUN: 'true'
      AUTO_EMAIL_REPORTS: 'false'
      DISCOVERY_ENABLED: 'false'
      DISCOVERY_DRY_RUN: 'true'
      ALLOW_TEST_PAYMENT_UNLOCK: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore latest whole-brain cognitive memory
        uses: actions/cache/restore@v4
        with:
          path: artifacts/uberbond-cognitive-cycle-latest.json
          key: uberbond-cognitive-cycle-${{ github.run_id }}
          restore-keys: |
            uberbond-cognitive-cycle-
      - name: Install exact locked dependencies
        run: npm ci
      - name: Run bounded aggressive self-maintenance burst and preserve truth receipt
        id: maintenance
        shell: bash
        run: |
          mkdir -p artifacts/cognitive
          tick_status=0
          for attempt in 1 2 3; do
            set +e
            node scripts/uberbond-self-maintainer-tick.mjs > artifacts/cognitive/self-maintainer-latest.json
            tick_status=$?
            set -e

            status="$(node -e "const fs=require('node:fs'); const p='artifacts/cognitive/self-maintainer-latest.json'; const v=JSON.parse(fs.readFileSync(p,'utf8')); if(!v || typeof v.status!=='string') process.exit(2); process.stdout.write(v.status)")"
            echo "attempt=$attempt status=$status exit=$tick_status"

            if [ "$tick_status" -ne 0 ]; then
              break
            fi

            case "$status" in
              RELAY_TASK_QUEUED|RELAY_TASK_ALREADY_QUEUED|WAITING_FOR_WORKER_RESULT)
                if [ "$attempt" -lt 3 ]; then
                  sleep 120
                fi
                ;;
              *)
                break
                ;;
            esac
          done
          echo "tick_status=$tick_status" >> "$GITHUB_OUTPUT"
      - name: Save self-maintenance truth for the next cognitive pulse
        uses: actions/cache/save@v4
        with:
          path: artifacts/cognitive/self-maintainer-latest.json
          key: uberbond-self-maintenance-${{ github.run_id }}
      - name: Upload self-maintenance truth receipt
        uses: actions/upload-artifact@v4
        with:
          name: uberbond-self-maintenance-${{ github.run_id }}
          path: artifacts/cognitive/self-maintainer-latest.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve unsuccessful maintenance as a visible workflow failure after its evidence is saved
        if: steps.maintenance.outputs.tick_status != '0'
        run: exit 1
