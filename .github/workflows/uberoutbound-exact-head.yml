name: UberOutbound Exact Head

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact checkout
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
      - name: Run focused exact-head verifier
        run: node scripts/uberoutbound-genome-verify.mjs
