name: uberbond

services:
  postgres:
    image: ${UBERBOND_POSTGRES_IMAGE:-postgres:16-alpine}
    pull_policy: never
    container_name: uberbond-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uberbond
      POSTGRES_USER: uberbond
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - uberbond-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uberbond -d uberbond"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  migrate:
    image: ${UBERBOND_RELEASE:?UBERBOND_RELEASE must name an already-loaded immutable app image}
    pull_policy: never
    container_name: uberbond-migrate
    init: true
    command: ["node", "scripts/migrate.mjs"]
    env_file:
      - ${UBERBOND_ENV_FILE:-/etc/uberbond/uberbond.env}
    environment:
      NODE_ENV: production
      PROCESS_ROLE: migrate
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://uberbond:${POSTGRES_PASSWORD}@postgres:5432/uberbond
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ${UBERBOND_RELEASE:?UBERBOND_RELEASE must name an already-loaded immutable app image}
    pull_policy: never
    container_name: uberbond-web
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    command: ["node", "portable-server.mjs"]
    env_file:
      - ${UBERBOND_ENV_FILE:-/etc/uberbond/uberbond.env}
    environment:
      NODE_ENV: production
      PROCESS_ROLE: web
      PORT: "8080"
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://uberbond:${POSTGRES_PASSWORD}@postgres:5432/uberbond
      DATABASE_SSL: "false"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  worker:
    image: ${UBERBOND_RELEASE:?UBERBOND_RELEASE must name an already-loaded immutable app image}
    pull_policy: never
    container_name: uberbond-worker
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    command: ["node", "worker.mjs"]
    env_file:
      - ${UBERBOND_ENV_FILE:-/etc/uberbond/uberbond.env}
    environment:
      NODE_ENV: production
      PROCESS_ROLE: worker
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://uberbond:${POSTGRES_PASSWORD}@postgres:5432/uberbond
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  uberbond-postgres:
    name: uberbond-postgres
