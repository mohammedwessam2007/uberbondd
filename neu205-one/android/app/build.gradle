plugins { id 'com.android.application' }
android {
 namespace 'ai.neu205.one'
 testNamespace 'ai.neu205.one.tests'
 compileSdk 35
 defaultConfig { applicationId 'ai.neu205.one'; minSdk 31; targetSdk 37; versionCode 3; versionName '1.2.0-v12-reconstructed'; testInstrumentationRunner 'ai.neu205.one.tests.AcceptanceInstrumentation' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { assets.srcDirs = ['src/main/assets', System.getenv('NEU205_ASSETS') ?: '/workspace/neu205-private/assets']; java.srcDirs += '../../core/src/main/java'; java.exclude 'ai/neu205/one/core/tools/**' } }
 sourceSets { androidTest { java.srcDirs = ['../instrumentation/src']; manifest.srcFile '../instrumentation/AndroidManifest.xml' } }
 if (System.getenv('NEU205_NATIVE_LIBS')) {
  sourceSets.main.jniLibs.srcDirs = [System.getenv('NEU205_NATIVE_LIBS')]
  def abi = System.getenv('NEU205_TEST_ABI') ?: 'arm64-v8a'
  if (!(abi in ['arm64-v8a', 'x86_64'])) throw new GradleException('Unsupported native test ABI')
  defaultConfig { ndk { abiFilters abi } }
 }
 if (System.getenv('NEU205_LLAMA_SOURCE')) {
  defaultConfig { ndk { abiFilters 'arm64-v8a' }; externalNativeBuild { cmake { arguments "-DLLAMA_SOURCE=${System.getenv('NEU205_LLAMA_SOURCE')}", '-DANDROID_STL=c++_static' } } }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
  ndkVersion '29.0.14206865'
 }
 testOptions { unitTests.includeAndroidResources = true }
}
dependencies { implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
if (System.getenv('NEU205_HOST_JNI_DIR')) {
 tasks.withType(Test).configureEach { systemProperty 'java.library.path', System.getenv('NEU205_HOST_JNI_DIR') }
}
